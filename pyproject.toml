[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengbot99"
version = "0.1.0"
description = "F-Zero 99 Schedule Discord Bot"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Pengui", email = "pengui@gmail.com" }]

dependencies = []

classifiers = [
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
]

# The Discord bot is one consumer of this package; the schedule logic is
# another, and it needs no Discord client. Install `pengbot99[bot]` to run
# the bot -- see README.md.
[project.optional-dependencies]
bot = ["py-cord>=2.5"]

[tool.setuptools]
include-package-data = true

# The CSV and .dat dumps of game content are what this package computes over.
# An installed copy that does not carry them is of no use to a caller that has
# no checkout. CONFIG_PATH still overrides them at runtime -- see README.md.
[tool.setuptools.package-data]
pengbot99 = ["data/*.csv", "data/*.dat"]

[tool.setuptools.packages.find]
where = ["py"]

[dependency-groups]
dev = ["ruff>=0.6.9", "pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
  ".uv-cache",
  ".ruff_cache",
  ".pytest_cache",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
